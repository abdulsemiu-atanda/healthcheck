[package]
name = "healthcheck"
authors = ["Abdulsemiu Atanda <semiu@live.com>"]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "healthcheck"
path = "src/lib.rs"

# Lower bounds are kept loose on purpose: the crate's pool and client types must
# unify with the ones each service already resolves, or a service could not hand
# its own pool to a check.
[dependencies]
actix-web = { version = "4.13", default-features = false, features = ["macros"] }
async-trait = "0.1.89"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
diesel = { version = "2.3.7", optional = true, features = ["postgres", "r2d2"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
log = "0.4"
redis = { version = "1.2.3", optional = true }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.52", features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
actix-web = { version = "4.13", features = ["macros"] }
serde_json = "1"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[features]
default = []
database = ["diesel"]
keystore = ["redis"]
